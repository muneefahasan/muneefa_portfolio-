<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Muneefa Hasan</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .thanks-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-black-900);
            padding: 20px;
        }

        .thanks-content {
            text-align: center;
            max-width: 600px;
            padding: 60px 40px;
            background: var(--bg-black-100);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .thanks-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--skin-color), var(--skin-color));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            animation: pulse 2s infinite;
        }

        .thanks-icon i {
            font-size: 50px;
            color: #fff;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(var(--skin-color-rgb), 0.4);
            }

            70% {
                box-shadow: 0 0 0 20px rgba(var(--skin-color-rgb), 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(var(--skin-color-rgb), 0);
            }
        }

        .thanks-content h1 {
            font-size: 42px;
            color: var(--skin-color);
            margin-bottom: 20px;
            font-weight: 700;
        }

        .thanks-content h2 {
            font-size: 24px;
            color: var(--text-black-900);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .thanks-content p {
            font-size: 16px;
            color: var(--text-black-700);
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .thanks-content .btn {
            display: inline-block;
            padding: 15px 40px;
            background: var(--skin-color);
            color: #fff;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .thanks-content .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .thanks-content .btn i {
            margin-right: 10px;
        }
    </style>
</head>

<body>
    <div class="thanks-container">
        <div class="thanks-content">
            <div class="thanks-icon">
                <i class="fas fa-check"></i>
            </div>
            <h1>Thank You!</h1>
            <h2>Your message has been sent successfully</h2>
            <p>
                I appreciate you reaching out to me. I'll review your message and get back to you as soon as possible.
                Usually, I respond within 24-48 hours.
            </p>
            <a href="index.html" class="btn">
                <i class="fas fa-arrow-left"></i>Back to Portfolio
            </a>
        </div>
    </div>
</body>

</html>
